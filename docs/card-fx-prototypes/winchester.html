// 윈체스터 (원본 좌표)

function shell(g, x, y, a) { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = '#d2a447'; g.fillRect(-3.5, -1.3, 7, 2.6); g.fillStyle = '#8e6a2a'; g.fillRect(-3.5, -1.6, 1, 3.2); g.restore(); }

// B 망원 조준경 — 움직임은 하나, 색·대비만 네 가지 (B1~B4)

// 눈금 5 (y≈150) 가 그 위에 걸리므로, 5 는 숫자를 오른쪽으로 더 비키고 살짝 위로 올린다.
const SCOPE_STYLES = {
  B1: {

  B5: {

    tick: (a) => `rgba(30,20,11,${a})`, halo: (a) => `rgba(255,247,230,${a * 0.9})`,

    label(g, s, x, y) { tag(g, s, x, y, 1, '700 9.5px sans-serif', 'center'); },

function tag(g, s, x, y, a, font, align) {
  g.font = font; const w = g.measureText(s).width, th = parseFloat(font.split(' ')[1]) + 3, tw = w + 5;
  const x0 = align === 'center' ? x - tw / 2 : x - 2.5, y0 = y - th + 2;
  g.fillStyle = `rgba(255,247,230,${a})`; g.fillRect(x0, y0, tw, th);
  g.strokeStyle = `rgba(184,134,42,${a})`; g.lineWidth = 0.8; g.strokeRect(x0 + 0.4, y0 + 0.4, tw - 0.8, th - 0.8);
  g.fillStyle = `rgba(30,20,11,${a})`; g.textAlign = 'left'; g.fillText(s, x0 + 2.5, y);

let FREEZE_B = false;
function scopeB(id) {
  const S = SCOPE_STYLES[id];
  return {
    id, name: S.name, cost: id === 'B3' ? 3 : 2, dur: 2000,
    desc: S.desc + ' · 움직임은 B 와 같다: 총구에서 조준경이 커지고, 흔들리다 눈금 1~5 가 켜지고 붉은 점 "틱" 고정, 렌즈가 열리며 끝',
    draw(g, t, q) {
      if (FREEZE_B) t = 0.7; // 눈금 1~5 가 다 켜지고 점이 고정된 뒤, 렌즈가 열리기 전
      bg(g); face(g);
      if (t >= 0.96) return;
      const grow = ease.out(seg(t, 0, 0.22)), open = ease.in(seg(t, 0.72, 0.96));

      }
      // 렌즈 색 (B3) — 저 화질에서도 덮개 한 장은 깐다
      if (S.tint) { g.save(); g.globalAlpha = al; g.fillStyle = S.tint; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill(); g.restore(); }
      if (q.on(2)) { const v = g.createRadialGradient(cx, cy, R * 0.7, cx, cy, R); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${0.5 * al})`); g.fillStyle = v; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill(); }

      g.strokeStyle = S.ring; g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, R - 2, 0, 7); g.stroke();
      if (glow) { g.shadowColor = S.glow; g.shadowBlur = 4; }
      g.strokeStyle = S.cross; g.lineWidth = 1; g.beginPath(); g.moveTo(cx - R, cy); g.lineTo(cx + R, cy); g.moveTo(cx, cy - R); g.lineTo(cx, cy + R); g.stroke();
      for (let i = 1; i <= 5; i++) {
        const k = seg(t, 0.24 + i * 0.05, 0.3 + i * 0.05); if (k <= 0) continue;

        if (S.halo) { g.strokeStyle = S.halo(k); g.lineWidth = 3; g.beginPath(); g.moveTo(cx - w, y); g.lineTo(cx + w, y); g.stroke(); }
        g.strokeStyle = S.tick(k); g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - w, y); g.lineTo(cx + w, y); g.stroke();
        // 5 는 붉은 점(cx, y)·고정 고리와 아래 사정거리 동그라미를 피해 오른쪽 위로 비킨다
        const nx = i === 5 ? cx + 12 : cx + w + 4, ny = i === 5 ? y + 1 : y + 3;
        S.num(g, String(i), nx, ny, k);

      const lk = seg(t, 0.58, 0.66);

        const y = cy + 5 * R / 6.2, r = 1.8 + (1 - lk) * 3;
        if (S.dotEdge) { g.fillStyle = S.dotEdge; g.beginPath(); g.arc(cx, y, r + 0.8, 0, 7); g.fill(); }
        g.fillStyle = S.dot || '#d9412b'; g.beginPath(); g.arc(cx, y, r, 0, 7); g.fill();
        if (lk < 1) { g.strokeStyle = `rgba(217,65,43,${1 - lk})`; g.lineWidth = 1; g.beginPath(); g.arc(cx, y, 3 + lk * 10, 0, 7); g.stroke(); }
        if (glow) { g.shadowColor = S.glow; g.shadowBlur = 5; }
        S.label(g, '사정거리 5', cx, cy - R * 0.55);
        g.shadowBlur = 0;
      }
      g.restore();
    },
  };
}

  kind: 'winchester', title: '윈체스터 연출 시안',
  lead: '윈체스터(사정거리 5, 가장 멀리) 장착. 레버액션 리듬과 "지평선 끝까지" 를 보여 준다. 칸을 누르면 다시 본다.',
  concepts: [

      draw(g, t, q) {

          shell(g, x, y, k * (12 + i * 3));
          if (q.on(1)) { const s = seg(k, 0, 0.5); if (s < 1) { g.strokeStyle = `rgba(200,190,175,${(1 - s) * 0.45})`; g.lineWidth = 1.5 + s * 2; g.beginPath(); g.moveTo(port.x, port.y); g.quadraticCurveTo(port.x + 4, port.y - 10 * s, port.x - 2 + Math.sin(s * 6) * 3, port.y - 22 * s); g.stroke(); } }

        }
      },
    },
    scopeB('B1'),
    scopeB('B2'),
    scopeB('B3'),
    scopeB('B4'),
    scopeB('B5'),
    {
