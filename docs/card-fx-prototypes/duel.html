<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결투 연출 시안</title>
<!--
  원본 그림 메모 (250×389)
  - 그림 칸은 대략 y 95~265. 하늘은 옅은 크림색, 바닥(큰길)은 y 212 아래
  - 왼쪽 x 26~94, y 104~214: 살롱 건물(기둥 3개, 'LOON' 간판)
  - 오른쪽 x 112~228: 화면 앞쪽 사나이의 등(어깨~다리). 허리띠 y 150~162, 권총집 x 205~232
  - 두 다리 사이 틈(x 138~162, y 178~265) 너머 멀리 x 146, y 206 에 상대가 작게 서 있다
  노린 것: 앞 사나이 다리 틈으로 보이는 먼 상대 = '지목한 한 명'. 그 틈으로 파고드는 대치·긴장·한 방.
  결투 규칙(번갈아 뱅!을 버림)은 D 에서 핑퐁으로 보여 준다.
  B1~B6 은 카우보이 모자 챙이 눈을 반쯤 가린 얼굴. B1~B3 은 한 얼굴 클로즈업, B4~B6 은 세 컷 분할.
  흐름은 같다(번뜩 → 가늘어짐 → 섬광·BANG!). 얼굴·모자는 도형·그라데이션만 쓴다 (cowboy()).
  ?freeze (또는 리드 아래 체크박스)로 B 안들을 눈이 가장 가늘어진 순간(SQ)에 멈춰 비교한다.
  소리 아이디어: 바람 휘파람(필터 노이즈) → 심장 박동 2번 → 정적 → 총성 하나와 긴 울림(리버브 꼬리).
-->
</head><body>
<script src="_kit.js"></script>
<script>
const { W, H, card, rng, seg, lerp, ease, art, bg, drawCard, shake } = FxKit;
const TX = 268, TY = 42; // 지목한 표적 자리 (오른쪽 위)
const env = (t, a, b, c, d) => seg(t, a, b) * (1 - seg(t, c, d));

function P(g, pts, fill) { g.fillStyle = fill; g.beginPath(); pts.forEach(([px, py], i) => { const p = art(px, py); i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); }); g.closePath(); g.fill(); }
function seat(g, x, y, a, label) {
  if (a <= 0.01) return;
  g.save(); g.globalAlpha = Math.min(1, a);
  g.fillStyle = '#2a1d12'; g.strokeStyle = '#c8902f'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#c8902f';
  g.beginPath(); g.arc(x, y - 3, 3.4, 0, 7); g.fill();
  g.beginPath(); g.ellipse(x, y + 7, 6.5, 5, 0, Math.PI, Math.PI * 2); g.fill();
  if (label) { g.font = '500 9px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#e8d6b0'; g.fillText(label, x, y + 24); }
  g.restore();
}

// 카드 안 그림 흉내: 살롱 + 앞 사나이 등 + 다리 틈 너머 먼 상대
function body(g, o) {
  o = o || {};
  const a = art(0, 92), b = art(250, 268);
  g.fillStyle = '#ecdfc2'; g.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
  const gy = art(0, 212).y;
  g.fillStyle = '#d9c49b'; g.fillRect(a.x, gy, b.x - a.x, b.y - gy);
  const s0 = art(26, 104), s1 = art(94, 214);
  g.fillStyle = '#bba987'; g.fillRect(s0.x, s0.y, s1.x - s0.x, s1.y - s0.y);
  g.fillStyle = '#8e7a5a';
  for (const px of [32, 56, 80]) { const c0 = art(px, 150), c1 = art(px + 5, 214); g.fillRect(c0.x, c0.y, c1.x - c0.x, c1.y - c0.y); }
  const sg = art(40, 110); g.fillStyle = '#efe2c6'; g.fillRect(sg.x, sg.y, 15, 5);
  // 먼 상대
  const f = art(146, 208), fs = o.farScale || 1;
  g.fillStyle = o.farColor || '#3b2a1c';
  g.beginPath(); g.arc(f.x, f.y - 5 * fs, 1.3 * fs, 0, 7); g.fill();
  g.fillRect(f.x - 1.1 * fs, f.y - 3.8 * fs, 2.2 * fs, 5.4 * fs);
  g.fillRect(f.x - 2.8 * fs, f.y - 6.3 * fs, 5.6 * fs, 0.9 * fs);
  // 앞 사나이 등
  P(g, [[112, 268], [114, 178], [108, 140], [118, 94], [228, 94], [232, 140], [220, 178], [218, 268], [162, 268], [158, 180], [140, 180], [138, 268]], '#6b4a2e');
  P(g, [[109, 150], [231, 148], [231, 162], [110, 163]], '#3d2a1a');
  P(g, [[205, 150], [232, 150], [228, 204], [210, 204]], '#2e1f13');
}
const cardDraw = (g, o) => drawCard(g, '결투', (gg) => body(gg, o));

// 미리 만든 입자 표
const WIND = (() => { const r = rng(21); return Array.from({ length: 40 }, () => ({ x: r() * 360, y: 12 + r() * 186, len: 14 + r() * 36, sp: 260 + r() * 260, a: 0.25 + r() * 0.45 })); })();
const SMOKE = (() => { const r = rng(5); return Array.from({ length: 14 }, () => ({ dx: (r() - 0.5) * 6, dy: -4 - r() * 10, r: 1 + r() * 2.5, d: r() * 0.08 })); })();
const DUST = (() => { const r = rng(33); return Array.from({ length: 90 }, () => ({ z: r(), u: r() * 2 - 1, sp: 0.35 + r() * 0.5, s: 0.6 + r() * 0.8 })); })();

// ── 시안 B1~B6 공용: 모자에 반쯤 가린 눈빛 ─────────────────────────────
// 흐름은 다섯 안이 같다: 띠가 열림(0~0.16) → 나·상대 번갈아 번뜩(0.2/0.32/0.44/0.56)
// → 눈이 가장 가늘어짐(SQ) → 섬광·BANG!(0.68~0.84) → 띠가 닫힘(0.82~0.97). t=1 에는 카드만 남는다.
const SQ = 0.66; // 눈이 가장 가늘고 날카로운 순간. "멈춰 보기"는 여기에 고정한다
let FREEZE = new URLSearchParams(location.search).has('freeze');
const tl = {
  open: (t) => ease.out(seg(t, 0, 0.16)) * (1 - ease.in(seg(t, 0.82, 0.97))),
  squint: (t, min) => lerp(1, min, ease.inOut(seg(t, 0.12, SQ))),
  tense: (t) => seg(t, 0.12, SQ),
  gl: (t, a) => env(t, a, a + 0.03, a + 0.06, a + 0.1),
  me: (t) => Math.max(tl.gl(t, 0.2), tl.gl(t, 0.44)),
  foe: (t) => Math.max(tl.gl(t, 0.32), tl.gl(t, 0.56)),
  cut: (t) => seg(t, 0.68, 0.84),
};

/** 아몬드형 눈 하나 (눈썹·쌍꺼풀·눈가 주름 포함). side=+1 이면 바깥 눈꼬리가 오른쪽.
    o 는 뜬 정도(1 → 0.15). 돌려주는 값은 홍채 중심의 화면 좌표 */
function eye(g, x, cy, w, o, s) {
  const q = s.q, rich = q.on(1) && !s.flat;
  const hw = w / 2, hu = Math.max(0.6, w * 0.21 * o), hd = Math.max(0.4, w * 0.11 * o);
  const side = s.side, ink = s.ink || '#1a0f08', dk = s.dk || '40,20,10';
  const look = s.look || 0;
  g.save(); g.translate(x, cy); g.scale(side, 1);
  const ix0 = -hw, iy0 = w * 0.04, ox = hw, oy = -w * 0.035;
  const upper = () => { g.moveTo(ix0, iy0); g.bezierCurveTo(-hw * 0.45, -hu * 1.35, hw * 0.4, -hu * 1.25, ox, oy); };
  const lowerBack = () => g.bezierCurveTo(hw * 0.45, hd * 1.3, -hw * 0.35, hd * 1.35, ix0, iy0);
  // 눈두덩 그늘
  const sock = s.sock == null ? 0.45 : s.sock, sc = s.sockC || '20,10,5';
  if (sock > 0) {
    if (rich) {
      const gr = g.createRadialGradient(0, -hu * 0.4, w * 0.08, 0, -hu * 0.4, w * 0.75);
      gr.addColorStop(0, `rgba(${sc},${sock})`); gr.addColorStop(1, `rgba(${sc},0)`);
      g.fillStyle = gr; g.fillRect(-w, -w * 0.8, w * 2, w * 1.5);
    } else {
      g.fillStyle = `rgba(${sc},${sock * 0.55})`; g.beginPath(); g.ellipse(0, -hu * 0.3, w * 0.6, w * 0.32, 0, 0, 7); g.fill();
    }
  }
  // 눈썹: 안쪽이 내려앉은 찡그림
  const by = s.browY != null ? s.browY : -w * 0.36 + (1 - o) * w * 0.1;
  const fr = s.frown == null ? 0.6 : s.frown, th = w * (s.browW || 0.085);
  const yi = by + w * 0.09 * fr, yo = by + w * 0.05, ym = by - w * 0.04 * (1 - fr * 0.5);
  g.fillStyle = s.browC || '#24160c';
  g.beginPath(); g.moveTo(-hw * 1.02, yi - th * 0.9); g.quadraticCurveTo(0, ym - th * 1.1, hw * 1.2, yo);
  g.quadraticCurveTo(0, ym + th * 0.4, -hw * 0.98, yi + th * 0.5); g.closePath(); g.fill();
  if (q.on(2) && !s.flat) {
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.6;
    for (let i = 0; i < 11; i++) {
      const u = i / 10, bx = lerp(-hw, hw * 1.1, u), byy = (1 - u) * (1 - u) * yi + 2 * u * (1 - u) * (ym - th * 0.3) + u * u * yo;
      g.beginPath(); g.moveTo(bx, byy + th * 0.4); g.lineTo(bx + Math.min(w * 0.06, 3.5), byy - th * 0.45); g.stroke();
    }
  }
  // 쌍꺼풀 주름
  g.strokeStyle = `rgba(${dk},0.5)`; g.lineWidth = Math.max(0.7, w * 0.018); g.lineCap = 'round';
  g.beginPath(); g.moveTo(-hw * 0.8, -hu * 1.0 - w * 0.07); g.quadraticCurveTo(-hw * 0.1, -hu * 1.5 - w * 0.1, hw * 0.95, oy - hu * 0.5 - w * 0.07); g.stroke();
  // 흰자 · 홍채 · 동공
  g.beginPath(); upper(); lowerBack(); g.closePath();
  g.fillStyle = s.white || '#e6d6ba'; g.fill();
  g.save(); g.clip();
  const ir = w * 0.2, ix = look * w * 0.13 * side, iy = -hu * 0.12;
  if (rich) {
    const gr = g.createRadialGradient(ix, iy, ir * 0.15, ix, iy, ir);
    gr.addColorStop(0, s.iris[1]); gr.addColorStop(0.72, s.iris[0]); gr.addColorStop(1, '#0c0705');
    g.fillStyle = gr; g.beginPath(); g.arc(ix, iy, ir, 0, 7); g.fill();
  } else {
    g.fillStyle = s.iris[0]; g.beginPath(); g.arc(ix, iy, ir, 0, 7); g.fill();
    g.strokeStyle = '#0c0705'; g.lineWidth = ir * 0.16; g.beginPath(); g.arc(ix, iy, ir * 0.92, 0, 7); g.stroke();
  }
  if (q.on(2) && !s.flat) {
    g.strokeStyle = 'rgba(255,232,190,0.2)'; g.lineWidth = 0.5;
    for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; g.beginPath(); g.moveTo(ix + Math.cos(a) * ir * 0.48, iy + Math.sin(a) * ir * 0.48); g.lineTo(ix + Math.cos(a) * ir * 0.88, iy + Math.sin(a) * ir * 0.88); g.stroke(); }
  }
  g.fillStyle = '#050302'; g.beginPath(); g.arc(ix, iy, ir * (s.pupil || 0.42), 0, 7); g.fill();
  // 윗눈꺼풀이 드리운 그늘
  if (rich) {
    const lg = g.createLinearGradient(0, -hu * 1.4, 0, hu * 0.4);
    lg.addColorStop(0, 'rgba(0,0,0,0.72)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lg; g.fillRect(-hw, -hu * 1.5, w, hu * 1.9);
  } else { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(-hw, -hu * 1.5, w, hu * 1.05); }
  const ca = s.catch == null ? 0.85 : s.catch;
  if (ca > 0) { g.fillStyle = `rgba(255,252,240,${ca})`; g.beginPath(); g.arc(ix - ir * 0.35 * side, iy - ir * 0.35, ir * 0.2, 0, 7); g.fill(); }
  g.restore();
  // 속눈썹 선(굵게) · 아랫눈꺼풀 · 눈밑 주름
  g.strokeStyle = s.lid || ink; g.lineWidth = Math.max(1.2, Math.min(3.6, w * 0.05)); g.lineJoin = 'round';
  g.beginPath(); upper(); g.lineTo(ox + w * 0.06, oy - w * 0.05); g.stroke();
  g.lineWidth = Math.max(0.6, w * 0.016); g.strokeStyle = `rgba(${dk},0.6)`;
  g.beginPath(); g.moveTo(ox, oy); lowerBack(); g.stroke();
  g.strokeStyle = `rgba(${dk},0.28)`;
  g.beginPath(); g.moveTo(-hw * 0.55, hd * 1.2 + w * 0.08); g.quadraticCurveTo(0, hd * 1.5 + w * 0.13, hw * 0.75, hd * 0.8 + w * 0.06); g.stroke();
  // 눈가 잔주름 (찡그릴수록 짙다)
  const wk = s.wrinkle || 0;
  if (wk > 0) {
    const n = s.wrinkleN || 3;
    g.strokeStyle = `rgba(${dk},${Math.min(1, wk * 0.6)})`; g.lineWidth = Math.max(0.6, w * 0.014);
    for (let i = 0; i < n; i++) {
      const a = (i - (n - 1) / 2) * 0.34;
      g.beginPath(); g.moveTo(ox + w * 0.05, oy + a * w * 0.12);
      g.quadraticCurveTo(ox + w * 0.15, oy + a * w * 0.2 - w * 0.012, ox + w * (0.24 + (i % 2) * 0.04), oy + a * w * 0.4); g.stroke();
    }
  }
  g.restore();
  return { x: x + look * w * 0.13, y: cy - hu * 0.12, r: w * 0.2 };
}

function glint(g, x, y, k, size, q, col) {
  if (k <= 0.01) return;
  g.save(); if (q.on(1)) g.globalCompositeOperation = 'lighter';
  const c = col || '255,246,220', L = size * (0.6 + k);
  g.strokeStyle = `rgba(${c},${k})`; g.lineWidth = 1; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - L, y); g.lineTo(x + L, y); g.moveTo(x, y - L * 0.55); g.lineTo(x, y + L * 0.55); g.stroke();
  g.fillStyle = `rgba(255,255,255,${k})`; g.beginPath(); g.arc(x, y, 1.1 + k * 1.3, 0, 7); g.fill();
  g.restore();
}
function grain(g, y0, hh, f, seed, n) { const r = rng(f * 7 + seed); g.fillStyle = 'rgba(255,240,220,0.16)'; for (let i = 0; i < n; i++) g.fillRect(r() * W, y0 + r() * hh, 1, 1); }
/** 섬광 + "BANG!" (원래 B 의 끝맺음) */
function bangEnd(g, t, q, hh) {
  const cut = tl.cut(t);
  if (cut <= 0 || cut >= 1) return;
  if (q.on(1)) { g.fillStyle = `rgba(255,250,236,${(1 - cut) * 0.9})`; g.fillRect(0, 0, W, H); }
  else { g.fillStyle = `rgba(255,250,236,${1 - cut})`; g.fillRect(0, 0, W, hh); g.fillRect(0, H - hh, W, hh); }
  g.save(); g.globalAlpha = Math.min(1, (1 - cut) * 2);
  g.translate(W / 2, H / 2 + 6); const s = 1.4 - 0.4 * ease.out(cut); g.scale(s, s);
  g.font = '600 38px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 6; g.strokeStyle = '#0d0906'; g.strokeText('BANG!', 0, 0);
  g.fillStyle = '#f0e4cc'; g.fillText('BANG!', 0, 0); g.restore();
}

/** 카우보이 모자를 쓴 얼굴 (눈 위쪽 클로즈업). 단위 u=sc, 눈선 (cx, ey).
    P.brim: 챙 앞끝(가운데) 높이, 눈선 기준 u 단위. 0 이면 챙이 눈 한가운데까지 내려와 위쪽 절반을 가린다.
    P.tilt: 모자 기울기(+ 면 오른쪽이 내려가 오른눈을 덮는다). P.rim: 역광 테두리 0~1. 돌려주는 값은 두 홍채 위치 */
function cowboy(g, P) {
  const { cx, ey, q } = P, u = P.sc;
  const ex = 47 * u, ew = 50 * u, fy = ey + 40 * u, rx = 100 * u, ry = 132 * u;
  const hatC = P.hatC || '#4a301c', bandC = P.bandC || '#17100a', rimC = P.rimC || '255,214,150';
  // 귀 · 얼굴
  g.fillStyle = P.skin; [-1, 1].forEach((d) => { g.beginPath(); g.ellipse(cx + d * 100 * u, ey + 30 * u, 11 * u, 22 * u, d * 0.15, 0, 7); g.fill(); });
  g.fillStyle = 'rgba(0,0,0,0.3)'; [-1, 1].forEach((d) => { g.beginPath(); g.ellipse(cx + d * 102 * u, ey + 30 * u, 5 * u, 13 * u, d * 0.15, 0, 7); g.fill(); });
  g.fillStyle = P.skin; g.beginPath(); g.ellipse(cx, fy, rx, ry, 0, 0, 7); g.fill();
  if (q.on(1)) {
    const rg = g.createRadialGradient(cx + 24 * u * (P.lightX || 0), ey + 24 * u, 16 * u, cx, fy, 132 * u);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.55, 'rgba(0,0,0,0.14)'); rg.addColorStop(1, 'rgba(0,0,0,0.62)');
    g.fillStyle = rg; g.beginPath(); g.ellipse(cx, fy, rx, ry, 0, 0, 7); g.fill();
  }
  // 콧등 그늘 · 콧방울
  g.fillStyle = 'rgba(30,14,6,0.13)';
  g.beginPath(); g.moveTo(cx + 5 * u, ey + 8 * u); g.quadraticCurveTo(cx + 12 * u, ey + 30 * u, cx + 16 * u, ey + 56 * u); g.lineTo(cx + 6 * u, ey + 60 * u); g.quadraticCurveTo(cx + 6 * u, ey + 30 * u, cx + u, ey + 8 * u); g.closePath(); g.fill();
  g.fillStyle = 'rgba(30,14,6,0.45)';
  [-1, 1].forEach((d) => { g.beginPath(); g.ellipse(cx + d * 9 * u, ey + 62 * u, 4.5 * u, 2.4 * u, d * 0.3, 0, 7); g.fill(); });
  // 수염 자국 · 콧수염 · 입
  if (P.mouth) {
    if (q.on(2)) { const r = rng(17); g.fillStyle = 'rgba(30,16,8,0.35)'; for (let i = 0; i < 160; i++) g.fillRect(cx + (r() * 2 - 1) * 72 * u, ey + 62 * u + r() * 44 * u, 0.8, 0.8); }
    g.strokeStyle = 'rgba(50,24,12,0.8)'; g.lineWidth = 1.6 * u; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx - 22 * u, ey + 84 * u); g.quadraticCurveTo(cx, ey + 81 * u, cx + 24 * u, ey + 85 * u); g.stroke();
    g.fillStyle = P.browC || '#24160c';
    g.beginPath(); g.moveTo(cx - 32 * u, ey + 86 * u); g.quadraticCurveTo(cx - 12 * u, ey + 66 * u, cx, ey + 72 * u); g.quadraticCurveTo(cx + 12 * u, ey + 66 * u, cx + 32 * u, ey + 86 * u);
    g.quadraticCurveTo(cx + 12 * u, ey + 76 * u, cx, ey + 78 * u); g.quadraticCurveTo(cx - 12 * u, ey + 76 * u, cx - 32 * u, ey + 86 * u); g.fill();
  }
  // 얼굴 역광 테두리
  if (P.rim > 0) {
    g.save(); if (q.on(1)) g.globalCompositeOperation = 'lighter';
    if (q.on(2)) { g.shadowColor = `rgba(${rimC},0.9)`; g.shadowBlur = 6; }
    g.strokeStyle = `rgba(${rimC},${0.75 * P.rim})`; g.lineWidth = 1.8;
    g.beginPath(); g.ellipse(cx, fy, rx, ry, 0, -0.55, 0.5); g.stroke();
    g.beginPath(); g.ellipse(cx, fy, rx, ry, 0, Math.PI - 0.5, Math.PI + 0.55); g.stroke();
    g.restore();
  }
  const hatT = () => { g.translate(cx, ey + (P.brim || 0) * u); g.rotate(P.tilt || 0); g.scale(u, u); };
  const front = () => { g.moveTo(-150, -34); g.bezierCurveTo(-125, -6, -70, 4, 0, 4); g.bezierCurveTo(70, 4, 125, -6, 150, -34); };
  // 챙 그늘이 얼굴에 드리운다
  const sd = P.shadow == null ? 30 : P.shadow;

          g.fillStyle = '#f3e7ce'; g.font = '600 10px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('뱅!', 0, 0.5);
          g.restore();
        }
        // 마지막: 표적이 못 받아침
        const lose = seg(t, 0.79, 0.95);
        if (lose > 0 && lose < 1) {
          ring(B, (1 - lose), '#e0453a');
          g.fillStyle = `rgba(224,69,58,${(1 - lose) * 0.35})`; g.beginPath(); g.arc(B.x, B.y, 12 + 8 * lose, 0, 7); g.fill();
          g.fillStyle = `rgba(255,214,200,${1 - lose})`; g.font = '600 14px sans-serif'; g.textAlign = 'center';
          g.fillText('−1', B.x, B.y - 20 - 10 * ease.out(lose));
        }
      },
    },
  ],
};
// B 안들만 SQ 에 멈춰 보기 (이 페이지 전용. ?freeze 로 켜진 채 열린다)
SPEC.concepts = SPEC.concepts.map((c) => (c.id[0] === 'B' ? { ...c, draw: (g, t, q, f) => c.draw(g, FREEZE ? SQ : t, q, f) } : c));
FxKit.mount(SPEC);
(() => {
  const lb = document.createElement('label');
  lb.style.cssText = 'display:inline-flex;gap:6px;align-items:center;font-size:13px;color:#e8d6b0;margin:0 0 12px;cursor:pointer';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = FREEZE;
  cb.onchange = () => {
    FREEZE = cb.checked;
    const u = new URL(location.href); if (FREEZE) u.searchParams.set('freeze', ''); else u.searchParams.delete('freeze');
    history.replaceState(null, '', u.toString().replace(/freeze=(&|$)/, 'freeze$1'));
  };
  lb.append(cb, document.createTextNode('B 안들만 눈이 가장 가늘어진 장면에 멈춰 보기'));
  document.querySelector('.lead').after(lb);
})();
