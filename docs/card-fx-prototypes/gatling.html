<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>기관총 연출 시안</title>
<!--
  원본 그림 메모 (250×389):
  - 그림 칸 x 45~215, y 95~265. 가운데에 총잡이가 개틀링을 허리춤에 들고 서 있다
  - 모자 챙 (125,120), 얼굴 (125,142), 몸통 (95~165, 160~260)
  - 개틀링 총열 묶음은 수평으로 x 100~205, y 198~212. 오른쪽 끝 총구 (207,205)
  - 탄창 드럼·손잡이는 (185~195, 190~205) 근처
  - 아래 기호: 뱅! + 모두 표적
  노린 것: 총구가 그림 오른쪽 가운데라 거기서 연사를 뽑고, 판 전체(다른 사람 자리 6개)를 쓸어 간다.
  "한 사람"이 아니라 "모두"라는 것이 보이게 탄이 여러 방향으로 퍼진다.
  소리 아이디어: 짧은 총성 12~16발을 18ms 간격으로 겹치고, 끝에 크랭크 헛도는 딸깍 + 탄피 짤랑.
-->
</head><body>
<script src="_kit.js"></script>
<script>
const { W, H, card, rng, seg, lerp, ease, art, bg, drawCard, shake } = FxKit;
const S = card.w / 250;
const CX = card.x + card.w / 2, CY = card.y + card.h / 2;
const M = art(207, 205); // 총구
const DRUM = art(190, 198);
const TAU = Math.PI * 2;

// 다른 사람 자리: 판 가운데를 둘러싼 타원. 아래(90°)는 나라서 비운다
const SEAT_DEG = [130, 186, 242, 298, 354, 410];
const seatAt = (deg) => { const a = deg * Math.PI / 180; return { x: 150 + Math.cos(a) * 132, y: 105 + Math.sin(a) * 88 }; };
const SEATS = SEAT_DEG.map(seatAt);
function seats(g, a, hit) {
  if (a <= 0) return;
  SEATS.forEach((p, i) => {
    const h = hit ? hit(i) : 0;
    g.globalAlpha = a; g.fillStyle = h > 0 ? `rgba(200,50,30,${0.35 + h * 0.5})` : 'rgba(30,20,11,0.55)';
    g.strokeStyle = '#c8902f'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(p.x, p.y, 7 + h * 3, 0, TAU); g.fill(); g.stroke();
  });
  g.globalAlpha = 1;
}

function gunman(g) {
  const p = art;
  g.fillStyle = '#e8d6b2'; const gr = p(45, 235); g.fillRect(card.x, gr.y, card.w, card.h);
  g.fillStyle = '#5d4e40';
  g.beginPath(); [[95, 165], [160, 158], [170, 262], [88, 262]].forEach(([x, y], i) => { const q = p(x, y); i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); }); g.fill();
  const hd = p(125, 142); g.fillStyle = '#b98b62'; g.beginPath(); g.arc(hd.x, hd.y, 13 * S, 0, TAU); g.fill();
  const hb = p(125, 122); g.fillStyle = '#4a3b2e'; g.beginPath(); g.ellipse(hb.x, hb.y, 34 * S, 6 * S, -0.08, 0, TAU); g.fill();
  g.fillRect(hb.x - 13 * S, hb.y - 18 * S, 26 * S, 16 * S);
  const b0 = p(100, 198), b1 = p(205, 212); g.fillStyle = '#3d3a38'; g.fillRect(b0.x, b0.y, b1.x - b0.x, b1.y - b0.y);
  g.strokeStyle = '#7d7468'; g.lineWidth = 0.8; for (let i = 1; i < 3; i++) { const y = lerp(b0.y, b1.y, i / 3); g.beginPath(); g.moveTo(b0.x, y); g.lineTo(b1.x, y); g.stroke(); }
  g.fillStyle = '#2a2724'; g.beginPath(); g.arc(DRUM.x, DRUM.y, 9 * S, 0, TAU); g.fill();
}
const draw = (g) => drawCard(g, '기관총', gunman);

// 별 모양 총구 불꽃
function flash(g, x, y, r, rot, hot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = hot ? '#fff3c0' : '#ffd166';
  g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; const rr = i % 2 ? r * 0.35 : r * (i % 4 ? 0.7 : 1); g.lineTo(Math.cos(a) * rr * 1.4, Math.sin(a) * rr); } g.closePath(); g.fill();
  g.restore();
}

// ---------- A: 그림 장면 — 총구 연사가 판을 쓸어 간다 ----------
const A_SHOTS = 30;
const A_CASE = (() => { const r = rng(21); return Array.from({ length: 26 }, (_, i) => ({ t0: 0.1 + (i / 26) * 0.6, vx: -15 - r() * 35, vy: -55 - r() * 45, spin: (r() - 0.5) * 30 })); })();
function A(g, t, q, f) {
  const fire = seg(t, 0.08, 0.72);
  g.save(); if (q.on(2) && fire > 0 && fire < 1) shake(g, 1.4, t);
  bg(g); draw(g);
  const sweep = (k) => lerp(SEAT_DEG[0] - 12, SEAT_DEG[5] + 12, k); // 총이 왼쪽 위에서 오른쪽 아래로 쓴다
  seats(g, Math.min(seg(t, 0, 0.1), 1 - seg(t, 0.85, 1)), (i) => { const k = seg(t, 0.08 + ((SEAT_DEG[i] - SEAT_DEG[0] + 12) / 304) * 0.64 + 0.04, 0.95); return k > 0 && k < 1 ? 1 - k : 0; });
  // 예광탄
  const n = q.n(A_SHOTS);
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const te = 0.08 + (i / n) * 0.64; const k = seg(t, te, te + 0.14); if (k <= 0 || k >= 1) continue;
    const tg = seatAt(sweep(i / n));
    const x = lerp(M.x, tg.x, k), y = lerp(M.y, tg.y, k), x0 = lerp(M.x, tg.x, Math.max(0, k - 0.18)), y0 = lerp(M.y, tg.y, Math.max(0, k - 0.18));
    g.strokeStyle = `rgba(255,214,120,${1 - k * 0.6})`; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x, y); g.stroke();
  }
  // 도는 총열 + 섬광
  if (fire > 0 && fire < 1) {
    const rot = t * 90;
    g.strokeStyle = '#9b9286'; g.lineWidth = 1;
    for (let j = 0; j < 6; j++) { const a = rot + j * TAU / 6; if (Math.cos(a) < 0) continue; const y = M.y + Math.sin(a) * 2.6; g.beginPath(); g.moveTo(M.x - 14, y); g.lineTo(M.x, y); g.stroke(); }
    if (f % 2 === 0) {
      const tg = seatAt(sweep(fire));
      const rot2 = Math.atan2(tg.y - M.y, tg.x - M.x);
      if (q.on(1)) { g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(M.x, M.y, 0, M.x, M.y, 22); gr.addColorStop(0, 'rgba(255,220,140,0.8)'); gr.addColorStop(1, 'rgba(255,120,30,0)'); g.fillStyle = gr; g.beginPath(); g.arc(M.x, M.y, 22, 0, TAU); g.fill(); g.restore(); }
      flash(g, M.x + Math.cos(rot2) * 4, M.y + Math.sin(rot2) * 4, 7, rot2, f % 4 === 0);
    }
  }
  // 탄피: 드럼에서 위로 튀어 바닥(카드 아래)에 한 번 튄다
  const floor = card.y + card.h + 18;
  A_CASE.slice(0, q.n(A_CASE.length)).forEach((c) => {
    const k = seg(t, c.t0, c.t0 + 0.3); if (k <= 0 || k >= 1) return;
    const s = k * 0.9; let x = DRUM.x + c.vx * s, y = DRUM.y + c.vy * s + 260 * s * s;
    if (y > floor) y = floor - (y - floor) * 0.3;
    g.save(); g.translate(x, y); g.rotate(c.spin * s); g.globalAlpha = 1 - k * k;
    g.fillStyle = '#d9a441'; g.fillRect(-2.4, -1, 4.8, 2); g.fillStyle = '#8a5f1c'; g.fillRect(1.6, -1, 0.8, 2);
    g.restore();
  });
  g.restore();
}

// ---------- B: 3D 포탑 — 카드가 들려 한 바퀴 돌며 쏜다 ----------
const B_N = 34;
const B_CASE = (() => { const r = rng(5); return Array.from({ length: 22 }, (_, i) => ({ t0: 0.2 + (i / 22) * 0.56, a: r() * TAU, sp: 18 + r() * 26, vz: 50 + r() * 30, spin: (r() - 0.5) * 20 })); })();
const B_lift = (t) => ease.out(seg(t, 0, 0.15)) * (1 - ease.inOut(seg(t, 0.8, 0.96)));
const B_theta = (t) => ease.inOut(seg(t, 0.15, 0.8)) * TAU;
function B_xf(t, px, py) { // 카드 안 한 점 → 화면 (회전·들림)
  const h = B_lift(t), th = B_theta(t), s = 1 + 0.12 * h;
  const dx = (px - CX) * s, dy = (py - CY) * s * (1 - 0.08 * h);
  return { x: CX + dx * Math.cos(th) - dy * Math.sin(th), y: CY - h * 9 + dx * Math.sin(th) + dy * Math.cos(th) };
}
function B(g, t, q) {
  bg(g);
  const h = B_lift(t), th = B_theta(t);
  seats(g, Math.min(seg(t, 0.1, 0.2), 1 - seg(t, 0.82, 0.95)));
  // 판 위 그림자 (들릴수록 멀어지고 흐려진다)
  if (h > 0) {
    g.save(); g.translate(CX + h * 6, CY + h * 10); g.rotate(th);
    if (q.on(2)) g.filter = `blur(${(h * 4).toFixed(1)}px)`;
    g.fillStyle = `rgba(0,0,0,${0.45 - h * 0.15})`; g.beginPath(); g.roundRect(-card.w / 2, -card.h / 2, card.w, card.h, 8); g.fill();
    g.restore();
  }
  // 총알: 쏜 순간의 총구 자리·방향에서 곧게 날아간다. 높이 z 는 그림자와의 간격으로 보인다
  const n = q.n(B_N);
  for (let i = 0; i < n; i++) {
    const te = 0.18 + (i / n) * 0.6; const k = seg(t, te, te + 0.16); if (k <= 0 || k >= 1) continue;
    const m0 = B_xf(te, M.x, M.y), a = B_theta(te);
    const d = 12 + k * 170, x = m0.x + Math.cos(a) * d, y = m0.y + Math.sin(a) * d, z = 9 * (1 - k);
    if (q.on(1)) { g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x, y + z + 6, 3, 1.2, a, 0, TAU); g.fill(); }
    g.strokeStyle = `rgba(255,224,150,${1 - k})`; g.lineWidth = 2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - Math.cos(a) * 14, y - Math.sin(a) * 14); g.lineTo(x, y); g.stroke();
  }
  // 카드
  g.save(); g.translate(CX, CY - h * 9); g.rotate(th); g.scale(1 + 0.12 * h, (1 + 0.12 * h) * (1 - 0.08 * h)); g.translate(-CX, -CY);
  draw(g);
  if (h > 0.05 && q.on(1)) { const gr = g.createLinearGradient(card.x, card.y, card.x + card.w, card.y + card.h); gr.addColorStop(0, `rgba(255,255,255,${h * 0.25})`); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.roundRect(card.x, card.y, card.w, card.h, 8); g.fill(); }
  g.restore();
  // 총구 섬광
  if (t > 0.16 && t < 0.79 && Math.floor(t * 90) % 2 === 0) { const m = B_xf(t, M.x, M.y); flash(g, m.x + Math.cos(th) * 5, m.y + Math.sin(th) * 5, 8 * (1 + 0.12 * h), th, true); }
  // 탄피: 드럼에서 솟아 포물선으로 떨어진다. 그림자는 판 위에 남는다
  B_CASE.slice(0, q.n(B_CASE.length)).forEach((c) => {
    const k = seg(t, c.t0, c.t0 + 0.24); if (k <= 0 || k >= 1) return;
    const o = B_xf(c.t0, DRUM.x, DRUM.y); const gx = o.x + Math.cos(c.a) * c.sp * k, gy = o.y + h * 9 + Math.sin(c.a) * c.sp * k * 0.6;
    const z = Math.max(0, 9 + c.vz * k - 150 * k * k); const sc = 1 + z / 50;
    g.globalAlpha = 1 - k * k;
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(gx, gy, 2.5, 1, 0, 0, TAU); g.fill();
    g.save(); g.translate(gx, gy - z); g.rotate(c.spin * k); g.scale(sc, sc); g.fillStyle = '#e0ad4a'; g.fillRect(-2.5, -1, 5, 2); g.restore();
    g.globalAlpha = 1;
  });
}

// ---------- C: 만화 잉크 — 드르르륵! 글자가 판을 한 바퀴 ----------
const C_TXT = ['드', '르', '르', '르', '륵', '!'];
function C(g, t, q, f) {
  bg(g, '#f3ead6'); draw(g);
  const k = seg(t, 0.05, 0.8);
  // 사방 집중선: 두 묶음이 번갈아 깜빡여 연사 리듬
  if (k > 0 && k < 1) {
    const set = Math.floor(t * 40) % 2, n = q.n(28);
    g.strokeStyle = '#1e140b'; g.lineWidth = 1.6;
    for (let i = set; i < n; i += 2) { const a = (i / n) * TAU + 0.1; const r0 = 78 + ((i * 7) % 5) * 4, r1 = 160; g.beginPath(); g.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0 * 0.75); g.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1 * 0.75); g.stroke(); }
  }
  // 잉크 총알: 8방향으로 세 물결
  const dirs = q.n(8) < 4 ? 4 : 8;
  for (let w = 0; w < 3; w++) {
    const bk = seg(t, 0.08 + w * 0.17, 0.36 + w * 0.17); if (bk <= 0 || bk >= 1) continue;
    for (let i = 0; i < dirs; i++) {
      const a = (i / dirs) * TAU + w * 0.35; const d = 58 + bk * 120;
      g.save(); g.translate(CX + Math.cos(a) * d, CY + Math.sin(a) * d * 0.75); g.rotate(a);
      g.fillStyle = '#1e140b'; g.strokeStyle = '#fffaf0'; g.lineWidth = 1.5;
      g.beginPath(); g.roundRect(-7, -2.6, 12, 5.2, 2.6); g.fill(); g.stroke(); g.restore();
    }
  }
  // 손글씨 의성어: 카드 위 호를 따라 한 글자씩 튀어나온다
  C_TXT.forEach((ch, i) => {
    const pk = seg(t, 0.08 + i * 0.07, 0.2 + i * 0.07); const out = seg(t, 0.78, 0.95);
    if (pk <= 0 || out >= 1) return;
    const a = lerp(-2.5, -0.65, i / (C_TXT.length - 1)); const x = CX + Math.cos(a) * 100, y = CY + 10 + Math.sin(a) * 94;
    const s = (pk < 1 ? ease.back(pk) : 1) * (1 - out);
    g.save(); g.translate(x + (f % 3 - 1) * 0.8, y); g.rotate(a + Math.PI / 2 + (i % 2 ? 0.12 : -0.12)); g.scale(s, s);
    g.font = '700 22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.lineWidth = 5; g.strokeStyle = '#1e140b'; g.strokeText(ch, 0, 0); g.fillStyle = '#f2c14e'; g.fillText(ch, 0, 0);
    g.restore();
  });
  // 낙서 탄피 몇 개
  for (let i = 0; i < q.n(10); i++) {
    const ck = seg(t, 0.15 + i * 0.05, 0.45 + i * 0.05); if (ck <= 0 || ck >= 1) continue;
    const x = M.x - 8 - i * 3 - ck * 20, y = M.y - 10 - ck * 30 + ck * ck * 75;
    g.save(); g.translate(x, y); g.rotate(ck * 8 + i); g.fillStyle = '#f2c14e'; g.strokeStyle = '#1e140b'; g.lineWidth = 1.2; g.beginPath(); g.rect(-3, -1.5, 6, 3); g.fill(); g.stroke(); g.restore();
  }
}

// ---------- D: 미니멀 UI — 조준선이 자리마다 그어지고 탄창 링이 준다 ----------
function D(g, t, q) {
  bg(g, '#1c1510'); draw(g);
  const appear = seg(t, 0, 0.12), gone = seg(t, 0.82, 1);
  const a = appear * (1 - gone);
  if (a <= 0) return;
  // 탄창 링: 카드 둘레 점선이 연사에 맞춰 줄어든다
  const ammo = 1 - ease.inOut(seg(t, 0.12, 0.7));
  g.save(); g.globalAlpha = a; g.strokeStyle = '#f2c14e'; g.lineWidth = 2; g.setLineDash([2, 3]);
  g.beginPath(); g.arc(CX, CY, 80, -Math.PI / 2, -Math.PI / 2 + TAU * ammo); g.stroke(); g.setLineDash([]);
  // 레이더 쓸기
  const sw = lerp(SEAT_DEG[0] - 20, SEAT_DEG[5] + 10, seg(t, 0.1, 0.72)) * Math.PI / 180;
  if (t > 0.1 && t < 0.74) {
    if (q.on(1)) { g.fillStyle = 'rgba(242,193,78,0.12)'; g.beginPath(); g.moveTo(CX, CY); g.arc(CX, CY, 150, sw - 0.5, sw); g.closePath(); g.fill(); }
    g.strokeStyle = 'rgba(242,193,78,0.8)'; g.lineWidth = 1; g.beginPath(); g.moveTo(CX, CY); g.lineTo(CX + Math.cos(sw) * 150, CY + Math.sin(sw) * 150); g.stroke();
  }
  // 자리마다: 조준선 → 맞음 표시 → −1
  SEATS.forEach((p, i) => {
    const hitT = 0.12 + ((SEAT_DEG[i] - SEAT_DEG[0] + 20) / 314) * 0.6;
    const k = seg(t, hitT - 0.05, hitT);
    const ring = seg(t, hitT, hitT + 0.15);
    g.strokeStyle = '#6d5a43'; g.lineWidth = 1.2; g.beginPath(); g.arc(p.x, p.y, 7, 0, TAU); g.stroke();
    if (k > 0) {
      g.strokeStyle = 'rgba(232,90,60,0.85)'; g.lineWidth = 1; g.beginPath(); g.moveTo(CX, CY); g.lineTo(lerp(CX, p.x, k), lerp(CY, p.y, k)); g.stroke();
      g.fillStyle = '#e85a3c'; g.beginPath(); g.arc(p.x, p.y, 4, 0, TAU); g.fill();
    }
    if (ring > 0 && ring < 1) { g.strokeStyle = `rgba(232,90,60,${1 - ring})`; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, 7 + ring * 12, 0, TAU); g.stroke(); }
    if (ring > 0) { g.fillStyle = '#f3e7ce'; g.font = '600 10px sans-serif'; g.textAlign = 'center'; g.fillText('−1', p.x, p.y - 12 - ease.out(ring) * 5); }
  });
  g.restore();
}

FxKit.mount({
  kind: 'gatling', title: '기관총 연출 시안',
  lead: '그림 속 개틀링 총구(오른쪽 가운데)에서 연사가 시작돼 판 둘레의 다른 자리 여섯 곳을 모두 쓸고 간다. 칸을 누르면 다시.',
  concepts: [
    { id: 'A', name: 'A. 그림 장면 · 쓸어 가는 연사', cost: 2, dur: 1800, draw: A,
      desc: '총열이 돌며 섬광이 깜빡이고, 예광탄이 왼쪽 위 자리부터 오른쪽 아래 자리까지 부채꼴로 쓸며 탄피가 튀어 바닥에 튄다 · 저: 탄 수·탄피 줄고 총구 빛무리·흔들림 없음' },
    { id: 'B', name: 'B. 3D 포탑 · 들려서 한 바퀴', cost: 3, dur: 2200, draw: B,
      desc: '카드가 판에서 들려(그림자가 멀어지고 흐려짐) 포탑처럼 한 바퀴 돌며 사방으로 쏘고, 탄피는 높이를 가진 포물선으로 떨어진다 · 저: 그림자 블러·광택·총알 그림자 없음, 탄 수 줄어듦' },
    { id: 'C', name: 'C. 만화 잉크 · 드르르륵!', cost: 1, dur: 1700, draw: C,
