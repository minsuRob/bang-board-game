<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>다이너마이트 연출 시안</title>
<!--
  원본 그림 메모 (250×389 기준)
  - 그림 칸: x 38~212, y 85~258. 옅은 하늘, 양옆에 바위(왼쪽 x 38~95, 오른쪽 x 165~212), 아래 주황 흙
  - 다이너마이트 한 자루가 공중에 비스듬히 떠 있다: 가운데 (128,155), 시계 방향 약 24°, 길이 ≈88
  - 위 끝 (146,115) 에서 심지가 오른쪽 위로 휘어 (173,91) 끝에 주황 불꽃
  노린 것: 놓을 때는 터지지 않는다. 불붙은 심지·째깍거림·'터질 듯 말 듯'까지만. 다이너마이트는 내 앞에 놓는 카드라
  C 는 작은 사본이 내 좌석(왼쪽 아래)으로 미끄러져 붙는다.
  소리: 심지 타는 '치지직'(하이패스 노이즈 + 무작위 탁탁 클릭) 루프, B 는 째깍 클릭 8번, D 는 끝에 '피식'(짧은 저음 바람).
-->
</head><body>
<script src="_kit.js"></script>
<script>
const { W, H, card, rng, seg, lerp, ease, art, bg, drawCard, shake } = FxKit;
const CX = card.x + card.w / 2, CY = card.y + card.h / 2, S = card.w / 250;

function plane(g, o, draw) {
  const f = 360, cz = Math.cos(o.rz || 0), sz = Math.sin(o.rz || 0), cx = Math.cos(o.rx || 0), sx = Math.sin(o.rx || 0), cy = Math.cos(o.ry || 0), sy = Math.sin(o.ry || 0);
  const pt = (x, y) => { const X = x * cz - y * sz, Y = x * sz + y * cz; const Y1 = Y * cx, Z1 = Y * sx; const X2 = X * cy + Z1 * sy, Z2 = -X * sy + Z1 * cy; const s = f / Math.max(40, f + Z2 + (o.z || 0)); return { x: o.x + X2 * s, y: o.y + Y1 * s }; };
  const a = pt(-o.w / 2, -o.h / 2), b = pt(o.w / 2, -o.h / 2), c = pt(-o.w / 2, o.h / 2);
  const A = (b.x - a.x) / o.w, B = (b.y - a.y) / o.w, C = (c.x - a.x) / o.h, D = (c.y - a.y) / o.h;
  const front = A * D - B * C > 0;
  if (draw) { g.save(); g.transform(A, B, C, D, a.x + A * o.w / 2 + C * o.h / 2, a.y + B * o.w / 2 + D * o.h / 2); draw(front); g.restore(); }
  return { pt, front };
}
function seat(g, x, y, a, ring) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a;
  g.fillStyle = '#3a2a1a'; g.strokeStyle = '#c8902f'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(x, y, 11, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#b39b74'; g.beginPath(); g.arc(x, y - 3, 3.4, 0, 7); g.fill();
  g.beginPath(); g.ellipse(x, y + 6, 6, 4, 0, Math.PI, 0); g.fill();
  if (ring > 0 && ring < 1) { g.strokeStyle = `rgba(242,193,78,${1 - ring})`; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 11 + ring * 16, 0, 7); g.stroke(); }
  g.restore();
}
function cardBack(g) {
  g.fillStyle = '#5a2a1c'; g.strokeStyle = '#8b5a2b'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(card.x, card.y, card.w, card.h, 8); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(239,226,198,0.25)'; g.lineWidth = 1;
  for (let i = -6; i < 12; i++) { g.beginPath(); g.moveTo(card.x + i * 14, card.y + 6); g.lineTo(card.x + i * 14 + 60, card.y + card.h - 6); g.moveTo(card.x + i * 14 + 60, card.y + 6); g.lineTo(card.x + i * 14, card.y + card.h - 6); g.stroke(); }
}

// ----- 그림 흉내 -----
const STICK = { c: art(128, 155), rot: 0.42 };
const TIP = art(173, 91);
function dynArt(o) {
  o = o || {};
  return (g) => {
    const a = art(38, 85), b = art(212, 258);
    g.fillStyle = '#d6e3ea'; g.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
    const poly = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach(([x, y], i) => { const p = art(x, y); i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); }); g.fill(); };
    poly([[38, 150], [70, 138], [96, 190], [84, 258], [38, 258]], '#c9b9a0');
    poly([[212, 160], [182, 148], [164, 205], [186, 258], [212, 258]], '#c2b197');
    poly([[38, 258], [70, 232], [125, 222], [190, 236], [212, 258]], '#d8894a');
    g.save(); g.translate(STICK.c.x, STICK.c.y); g.rotate(STICK.rot);
    g.fillStyle = '#c99a52'; g.strokeStyle = '#7a5428'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(-15 * S, -44 * S, 30 * S, 88 * S, 4 * S); g.fill(); g.stroke();
    g.fillStyle = 'rgba(122,84,40,0.35)'; g.fillRect(-15 * S, -10 * S, 30 * S, 3 * S); g.fillRect(-15 * S, 18 * S, 30 * S, 3 * S);
    g.fillStyle = '#e0bf80'; g.beginPath(); g.ellipse(0, -44 * S, 15 * S, 4 * S, 0, 0, 7); g.fill();
    g.restore();
    const f0 = art(146, 115), fc = art(150, 95);
    g.strokeStyle = '#5a4632'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(f0.x, f0.y); g.quadraticCurveTo(fc.x, fc.y, TIP.x, TIP.y); g.stroke();
    if (o.flame !== false) { g.fillStyle = '#f0a040'; g.beginPath(); g.ellipse(TIP.x + 1, TIP.y - 2, 2.2, 3.4, 0.4, 0, 7); g.fill(); }
  };
}
const TITLE = '다이너마이트';

const SPARKS = (() => { const r = rng(7); return Array.from({ length: 70 }, () => ({ b: r() * 0.72, life: 0.1 + r() * 0.16, a: -Math.PI / 2 + (r() - 0.5) * 2.6, v: 25 + r() * 55, hot: r() })); })();
const PUFFS = (() => { const r = rng(9); return Array.from({ length: 8 }, (_, i) => ({ b: i * 0.08, dx: 6 + r() * 14, r: 4 + r() * 4 })); })();
const DOTS = (() => { const out = []; for (let y = 6; y < H; y += 9) for (let x = 6 + ((y / 9) % 2) * 4.5; x < W; x += 9) out.push([x, y]); return out; })();
const SWEAT = [[-8, -6], [8, -14], [-2, 12]];

/** 불꽃 입자 하나 (나이 k 0→1) */
function sparkAt(x, y, s, k) { return { x: x + Math.cos(s.a) * s.v * k, y: y + Math.sin(s.a) * s.v * k + 46 * k * k }; }

FxKit.mount({
  kind: 'dynamite',
  title: '다이너마이트 연출 시안',
  lead: '놓을 때는 터지지 않는다. 심지만 타들어 가고 째깍거린다. 칸을 누르면 다시 본다.',
  concepts: [
    {
      id: 'A', name: 'A. 심지 불꽃 (사실풍 입자)', cost: 2, dur: 1800,
      desc: '그림 속 심지 끝에서 불티가 사방으로 튀고 가는 연기가 오른다. 불티가 잦아들면 그림 속 작은 불꽃만 남는다 · 저: 빛 합성·연기 없이 불티 몇 개',
      draw(g, t, q, f) {
        bg(g);
        drawCard(g, TITLE, dynArt());
        const env = seg(t, 0, 0.08) * (1 - seg(t, 0.75, 0.98));
        if (q.on(1)) {
          for (const p of PUFFS) { const k = seg(t, p.b, p.b + 0.35); if (k <= 0 || k >= 1) continue; const x = TIP.x + p.dx * k, y = TIP.y - 4 - 34 * k, r = p.r + 10 * k; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(160,150,140,${0.35 * (1 - k)})`); gr.addColorStop(1, 'rgba(160,150,140,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
        }
        g.save();
        if (q.on(1)) g.globalCompositeOperation = 'lighter';
        if (env > 0) {
          const fl = 1 + Math.sin(f * 1.7) * 0.25;
          if (q.on(1)) { const gr = g.createRadialGradient(TIP.x, TIP.y, 0, TIP.x, TIP.y, 16 * fl); gr.addColorStop(0, `rgba(255,240,190,${env})`); gr.addColorStop(0.35, `rgba(255,170,60,${0.7 * env})`); gr.addColorStop(1, 'rgba(255,100,20,0)'); g.fillStyle = gr; g.beginPath(); g.arc(TIP.x, TIP.y, 16 * fl, 0, 7); g.fill(); }
          else { g.fillStyle = `rgba(255,200,90,${env})`; g.beginPath(); g.arc(TIP.x, TIP.y, 4 * fl, 0, 7); g.fill(); }
        }
        const n = q.n(SPARKS.length);
        g.lineCap = 'round';
        for (let i = 0; i < n; i++) {
          const s = SPARKS[i]; const k = (t - s.b) / s.life; if (k <= 0 || k >= 1) continue;
          const p = sparkAt(TIP.x, TIP.y, s, k), p0 = sparkAt(TIP.x, TIP.y, s, Math.max(0, k - 0.12));
          g.strokeStyle = s.hot > 0.5 ? `rgba(255,245,200,${1 - k})` : `rgba(255,${150 + (i % 4) * 20},60,${1 - k})`; g.lineWidth = 1.3;
          g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p.x, p.y); g.stroke();
        }
        g.restore();
      },
    },
    {
      id: 'B', name: 'B. 째깍 시계 (미니멀 UI)', cost: 1, dur: 1600,
      desc: '카드 둘레에 눈금 8칸 고리가 생기고 째깍마다 한 칸씩 붉게 차며 카드가 맥박처럼 뛴다. 아래에 "♠2~9 이면 목숨 3" · 저: 차이 없음',
      draw(g, t) {
        bg(g);
        const env = ease.out(seg(t, 0, 0.12)) * (1 - seg(t, 0.8, 1));
        const ticks = 8, t0 = 0.1, dt = 0.08;
        const lit = Math.max(0, Math.min(ticks, Math.floor((t - t0) / dt) + 1));
        const since = t >= t0 && lit <= ticks ? ((t - t0) % dt) / dt : 1;
        const pulse = t < t0 + ticks * dt ? 1 + 0.035 * (1 - ease.out(Math.min(1, since * 2.5))) : 1;
        g.save(); g.translate(CX, CY); g.scale(pulse, pulse); g.translate(-CX, -CY); drawCard(g, TITLE, dynArt()); g.restore();
        if (env <= 0) return;
        const R = 82;
        g.save(); g.globalAlpha = env;
        g.strokeStyle = 'rgba(243,231,206,0.25)'; g.lineWidth = 2; g.beginPath(); g.arc(CX, CY, R, 0, 7); g.stroke();
        for (let i = 0; i < ticks; i++) {
          const a0 = -Math.PI / 2 + (i / ticks) * Math.PI * 2 + 0.06, a1 = a0 + (Math.PI * 2) / ticks - 0.12;
          g.strokeStyle = i < lit ? '#d0643a' : 'rgba(243,231,206,0.35)'; g.lineWidth = i === lit - 1 ? 6 : 4;
          g.beginPath(); g.arc(CX, CY, R, a0, a1); g.stroke();
        }
        if (lit > 0 && t < t0 + ticks * dt) {
          g.fillStyle = '#f2c14e'; g.font = '700 12px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.globalAlpha = env * (1 - since);
          g.fillText('째깍', CX + (lit % 2 ? 1 : -1) * 112, CY - 40);
          g.globalAlpha = env;
        }
        g.fillStyle = 'rgba(27,18,11,0.85)'; g.beginPath(); g.roundRect(CX - 56, 184, 112, 18, 9); g.fill();
        g.fillStyle = '#f3e7ce'; g.font = '500 10.5px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♠2~9 이면 목숨 3', CX, 193.5);
        g.restore();
      },
    },
    {
      id: 'C', name: 'C. 던져 놓기 (3D)', cost: 2, dur: 1800,
      desc: '카드가 앞쪽에서 빙글빙글 돌며 날아와 판 위에 툭 떨어지고, 심지 불티가 꼬리를 남긴다. 작은 사본이 내 좌석으로 미끄러져 붙는다 · 저: 꼬리 짧게, 그림자 흐림 없음',
      draw(g, t, q) {
        bg(g);
        const k = seg(t, 0, 0.46), e = ease.out(k);
        const pose = (kk) => { const ee = ease.out(kk); return { x: CX + lerp(-170, 0, ee), y: CY + lerp(110, 0, ee) - Math.sin(ee * Math.PI) * 70, rx: (1 - ee) * 1.1, ry: (1 - ee) * Math.PI * 3, z: lerp(-150, 0, ee) }; };
        const p = pose(k);
        const b = seg(t, 0.46, 0.62); p.y -= Math.sin(b * Math.PI) * 7 * (1 - b);
        const ground = { x: CX + lerp(-170, 0, e), y: CY + 14 + lerp(110, 0, e) };
        const air = Math.sin(e * Math.PI) + (1 - e) * 0.6 + Math.sin(b * Math.PI) * 0.15;
        g.save(); g.fillStyle = `rgba(0,0,0,${0.3 * (1 - air * 0.6)})`;
        if (q.on(2)) { g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 10 * air; }
        g.beginPath(); g.ellipse(ground.x, ground.y + 40, card.w * 0.5 * (1 - air * 0.3), 10, 0, 0, 7); g.fill(); g.restore();
        // 심지 불티 꼬리: 지난 자세들의 심지 끝
        const tl = q.n(16), sp = 0.012;
        for (let i = tl; i >= 0; i--) {
          const kk = seg(t - i * sp, 0, 0.46); if (t - i * sp < 0) continue;
          const pp = pose(kk); const pr = plane(null, { x: pp.x, y: pp.y, w: card.w, h: card.h, rx: pp.rx, ry: pp.ry, z: pp.z }).pt(TIP.x - CX, TIP.y - CY);
          const a = (1 - i / (tl + 1)) * (1 - seg(t, 0.55, 0.85));
          if (a <= 0) continue;
          g.fillStyle = `rgba(255,${180 - i * 6},70,${a})`; g.beginPath(); g.arc(pr.x, pr.y, 2.4 - i * 0.1, 0, 7); g.fill();
        }
        plane(g, { x: p.x, y: p.y, w: card.w, h: card.h, rx: p.rx, ry: p.ry, z: p.z }, (front) => { g.translate(-CX, -CY); front ? drawCard(g, TITLE, dynArt()) : cardBack(g); });
        // 내 앞에 놓기
        const sx = 34, sy = 186;
        seat(g, sx, sy, seg(t, 0.58, 0.66) * (1 - seg(t, 0.94, 1)), seg(t, 0.84, 0.98));
        const fly = seg(t, 0.64, 0.86);
        if (fly > 0 && fly < 1) {
          const ee = ease.inOut(fly); const x = lerp(CX, sx, ee), y = lerp(CY, sy, ee), s = lerp(0.55, 0.18, ee);
          g.save(); g.globalAlpha = 0.85; g.translate(x, y); g.rotate(-ee * 0.5); g.scale(s, s); g.translate(-CX, -CY); drawCard(g, TITLE, dynArt()); g.restore();
        }
      },
    },
    {
      id: 'D', name: 'D. 터질 듯 말 듯 (만화 잉크)', cost: 2, dur: 2200,
      desc: '망점 바탕에 심지 불꽃이 잉크 별로 커지고 "치지직…", 카드가 떨고 식은땀. 펑 대신 "피식" 연기와 "…아직." · 저: 망점·떨림 없이 별과 글씨만',
      draw(g, t, q, f) {
        bg(g);
        const tense = ease.inOut(seg(t, 0.05, 0.55));
        const fizz = seg(t, 0.58, 0.66);
        const env = 1 - seg(t, 0.82, 1);
        if (q.on(1) && env > 0) {
          const n = q.n(DOTS.length);
          g.fillStyle = `rgba(242,193,78,${0.18 * tense * env})`;
          for (let i = 0; i < n; i++) { const [x, y] = DOTS[i]; const d = Math.hypot(x - CX, y - CY); const r = Math.max(0, 2.6 - d / 70) * tense; if (r > 0.2) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); } }
        }
        g.save();
        if (q.on(1) && t < 0.58) { const a = 0.6 * tense; g.translate(Math.sin(f * 2.1) * a, Math.cos(f * 1.7) * a); }
        drawCard(g, TITLE, dynArt({ flame: true }));
        g.restore();
        // 잉크 별
        if (t < 0.6) {
          const r = lerp(6, 22, tense) * (1 + Math.sin(f * 1.3) * 0.12);
          g.beginPath(); const n = 10;
          for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * 0.45 : r * (0.85 + ((i * 37 + f) % 7) / 25); const an = (i / (n * 2)) * Math.PI * 2; g.lineTo(TIP.x + Math.cos(an) * rr, TIP.y + Math.sin(an) * rr); }
          g.closePath(); g.fillStyle = '#ffd34a'; g.fill(); g.strokeStyle = '#111'; g.lineWidth = 2; g.stroke();
          g.fillStyle = '#ff7a2a'; g.beginPath(); g.arc(TIP.x, TIP.y, r * 0.3, 0, 7); g.fill();
        }
        // 식은땀
        const sw = seg(t, 0.25, 0.4) * (1 - seg(t, 0.62, 0.7));
        if (sw > 0) {
          g.save(); g.globalAlpha = sw;
          SWEAT.forEach(([dx, dy], i) => { const x = card.x - 10 + dx * 0.4 + (i === 1 ? card.w + 20 : 0), y = card.y + 30 + dy + seg(t, 0.25, 0.7) * 10; g.fillStyle = '#8fd0f0'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y - 7); g.quadraticCurveTo(x + 5, y, x, y + 3); g.quadraticCurveTo(x - 5, y, x, y - 7); g.fill(); g.stroke(); });
          g.restore();
        }
        // 글씨
        const ink = (txt, x, y, size, a) => { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `900 ${size}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.strokeStyle = '#111'; g.lineWidth = 5; g.strokeText(txt, x, y); g.fillStyle = '#ffe9a8'; g.fillText(txt, x, y); g.restore(); };
        ink('치지직…', 250, 34 + Math.sin(f * 0.9) * 1.5, lerp(11, 19, tense), seg(t, 0.08, 0.18) * (1 - fizz));
        // 피식 연기
        if (fizz > 0) {
          const k = seg(t, 0.58, 0.92);
          if (k < 1) for (let i = 0; i < 4; i++) { const x = TIP.x + (i - 1.5) * 5 + k * 6, y = TIP.y - 4 - k * 22 - i * 3, r = 4 + k * 8 - i; g.fillStyle = `rgba(200,195,185,${0.8 * (1 - k)})`; g.strokeStyle = `rgba(17,17,17,${0.8 * (1 - k)})`; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, Math.max(1, r), 0, 7); g.fill(); g.stroke(); }
          ink('피식', TIP.x + 36, TIP.y - 18, 13, (1 - seg(t, 0.7, 0.8)));
          ink('…아직.', 248, 40, 17, seg(t, 0.66, 0.72) * env);
        }
      },
    },
  ],
});
</script></body></html>
