<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>카드 연출 시안</title>
<!--
  카드 연출 시안 모음. 왼쪽에서 카드를 고르면 오른쪽에 그 카드의 시안 네 개가 돈다.
  ← → 키로 앞뒤 카드. 위쪽 저·중·고는 모든 시안에 같은 화질을 건다 (?q=).
  시안 한 장은 _kit.js 틀을 쓴다. 자세한 흐름은 docs/card-fx.md, 성능은 docs/card-fx-perf.md
-->
<style>
  :root { --bg:#1b120b; --panel:#24180f; --line:#5c452c; --ink:#f3e7ce; --mute:#b39b74; --gold:#c8902f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 240px 1fr; grid-template-rows: auto 1fr; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  header .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  button { background: #3a2a1a; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--gold); color: var(--bg); }
  nav { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px 0 24px; }
  nav h2 { font-size: 11px; letter-spacing: .04em; color: var(--mute); font-weight: 500; margin: 14px 14px 4px; }
  nav a { display: flex; justify-content: space-between; gap: 6px; padding: 6px 14px; color: var(--ink); text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
  nav a small { color: var(--mute); font-size: 11px; }
  nav a:hover { background: #2f2216; }
  nav a.on { background: #3a2a1a; border-left-color: var(--gold); }
  nav a.miss { opacity: .45; }
  main { position: relative; min-width: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  #doc { position: absolute; inset: 0; overflow-y: auto; padding: 20px 28px 60px; display: none; line-height: 1.6; font-size: 14px; }
  #doc h2 { font-size: 16px; font-weight: 500; margin: 24px 0 6px; }
  #doc table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  #doc td, #doc th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  #doc th { color: var(--mute); font-weight: 500; }
  #doc code { background: #2f2216; padding: 1px 4px; border-radius: 4px; }
  #doc pre { background: #2f2216; padding: 10px; border-radius: 8px; overflow-x: auto; }
  #doc pre code { padding: 0; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    header { grid-column: 1; }
    nav { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>카드 연출 시안</h1>
  <span id="where" style="color:var(--mute);font-size:13px"></span>
  <span class="sp"></span>
  <span style="font-size:13px;color:var(--mute)">화질</span>
  <span class="seg" id="seg"></span>
  <button id="prev" aria-label="이전 카드">←</button>
  <button id="next" aria-label="다음 카드">→</button>
</header>
<nav id="nav"></nav>
<main><iframe id="view" title="시안"></iframe><div id="doc"></div></main>
<script>
// [파일 이름, 한국어 이름, 묶음]
const GROUPS = [
  ['개요', [['_perf', '버벅임 분석 · 화질 3단계'], ['_picks', '추천 모아 보기']]],
  ['완성 (게임에 들어감)', [['bang', '뱅! · D+A'], ['missed', '빗나감!'], ['volcanic', '볼캐닉 · A'], ['schofield', '스코필드 · B'], ['remington', '레밍턴 · C'], ['carabine', '카빈 · B'], ['winchester', '윈체스터 · B3'], ['scope', '조준경 · A'], ['mustang', '야생마 · B'], ['barrel', '술통 · C'], ['gatling', '기관총 · A'], ['indians', '인디언! · A']]],
  ['총기 · 장비', [['lemat', '르매트'], ['shotgun', '샷건']]],
  ['여러 명 공격', [['fanning', '패닝'], ['bandidos', '반디도스'], ['tornado', '토네이도']]],
  ['한 명 공격', [['duel', '결투'], ['aim', '조준'], ['tomahawk', '토마호크'], ['backfire', '역화'], ['panic', '강탈']]],
  ['회복 · 뽑기', [['beer', '맥주'], ['saloon', '주점'], ['lastCall', '라스트 콜'], ['stagecoach', '역마차'], ['wellsFargo', '웰스 파고']]],
  ['방어 · 특수', [['escape', '탈출'], ['saved', '구조!'], ['ghost', '유령'], ['catBalou', '캣 벌로우'], ['generalStore', '잡화점']]],
  ['앞에 놓는 카드', [['jail', '감옥'], ['dynamite', '다이너마이트'], ['rattlesnake', '방울뱀'], ['bounty', '포상금'], ['poker', '포커']]],
];
const ORDER = GROUPS.flatMap(([, list]) => list.map(([k]) => k));
const NAME = Object.fromEntries(GROUPS.flatMap(([, list]) => list));
const nav = document.getElementById('nav');
const links = {};
for (const [title, list] of GROUPS) {
  const h = document.createElement('h2'); h.textContent = title; nav.append(h);
  for (const [k, n] of list) {
    const a = document.createElement('a'); a.href = '#' + k;
    const s = document.createElement('span'); s.textContent = n;
    const sm = document.createElement('small'); sm.textContent = k.startsWith('_') ? '' : k;
    a.append(s, sm); nav.append(a); links[k] = a;
  }
}
const LEVELS = ['low', 'mid', 'high'];
let q = 'high';
try { q = localStorage.getItem('fxq') || 'high'; } catch (e) {}
const seg = document.getElementById('seg');
const qb = LEVELS.map((l, i) => { const b = document.createElement('button'); b.textContent = ['저', '중', '고'][i]; b.onclick = () => { q = l; try { localStorage.setItem('fxq', l); } catch (e) {} paintQ(); show(cur()); }; seg.append(b); return b; });
function paintQ() { qb.forEach((b, i) => b.classList.toggle('on', LEVELS[i] === q)); }
paintQ();
const view = document.getElementById('view'), doc = document.getElementById('doc');
const cur = () => (location.hash.slice(1) || '_picks');
function show(k) {
  if (!NAME[k]) k = 'volcanic';
  Object.entries(links).forEach(([kk, a]) => a.classList.toggle('on', kk === k));
  document.getElementById('where').textContent = NAME[k];
  const sec = document.getElementById('sec' + k);
  if (sec) { view.style.display = 'none'; view.src = 'about:blank'; doc.style.display = 'block'; doc.innerHTML = sec.innerHTML; return; }
  doc.style.display = 'none'; view.style.display = 'block';
  // 완성본 중 bang, missed 는 옛 틀이라 화질 토글이 없다
  view.src = k + '.html?q=' + q;
  links[k].scrollIntoView({ block: 'nearest' });
}
function step(d) { const i = ORDER.indexOf(cur()); location.hash = ORDER[(i + d + ORDER.length) % ORDER.length]; }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
addEventListener('hashchange', () => show(cur()));
// 개요 내용(template)은 이 스크립트 아래에 있으므로 다 읽은 뒤 띄운다
addEventListener('DOMContentLoaded', () => show(cur()));
</script>

<!-- 개요 페이지 내용. 하위 작업이 끝나면 채운다 -->
<template id="sec_perf"><h1>카드 연출 성능과 화질 3단계</h1>
<p>카드를 낼 때 버벅이는 원인을 코드에서 찾고, 지금의 2단계(고화질·일반)를 3단계로 나누는 안을 적는다.
코드는 아직 고치지 않았다. 이 문서는 분석과 설계안이다.</p>
<h2>한 줄 결론</h2>
<p>버벅임은 연출 하나가 무거워서라기보다 <strong>세 가지가 같은 순간에 겹쳐서</strong> 생긴다.
화면 전체에 도는 fbm 연기 셰이더(GPU), 카메라 흔들림 동안 매 프레임 다시 그려지는 오버레이 React 트리(JS),
그리고 같은 순간 함께 도는 3D 테이블이다. 단계 나누기보다 먼저 <strong>단계와 상관없는 고침 3가지</strong>를 넣고,
그다음 저·중·고로 나누는 것이 맞다.</p>
<h2>가장 효과 큰 고침 3가지 (예상 효과 순)</h2>
<table>
<thead>
<tr>
<th>순서</th>
<th>고침</th>
<th>근거</th>
<th>기대 효과</th>
</tr>
</thead>
<tbody><tr>
<td>1</td>
<td><strong>연기 셰이더를 총구 둘레 사각형에만 그린다.</strong> 지금은 캔버스 전체(테이블 영역 전부)에 5옥타브 fbm 을 1.9초 동안 돌린다</td>
<td><code>CardFxSkia.tsx:227-231</code> 의 <code>&lt;Rect x={0} y={0} width={w} height={h}&gt;</code>, <code>shaders.ts:37</code> 5옥타브, <code>shotFrame</code> 의 <code>smoke</code> 는 60ms~2000ms 동안 0 이 아님(<code>timeline.ts:145</code>)</td>
<td>연기가 실제로 보이는 곳은 총구 앞 카드 폭 2<del>3배 정도다. 그리는 픽셀이 대략 1/10</del>1/20 로 준다. 폰 GPU 에서 가장 큰 비용으로 본다 (추측, 측정 필요)</td>
</tr>
<tr>
<td>2</td>
<td><strong>카드 낼 때 매 프레임 일어나는 React 재렌더를 끊는다.</strong> <code>Overlay3D</code> 가 앵커 스토어 전체를 구독해서, 카메라가 흔들리는 동안 매 프레임 Overlay3D → <code>PlayedCardSpotlight</code> → Skia 캔버스 자식 트리까지 다시 렌더된다</td>
<td><code>Overlay3D.tsx:41</code> <code>useStore(anchorsStore)</code> (선택자 없음), <code>Scene.tsx:147</code> 카메라가 움직이면 매 프레임 <code>project</code>, <code>AnchorProjector.ts:135-137</code> 0.5px 넘게 바뀌면 <code>setState</code>, 뱅!은 <code>Sequencer.ts:142</code> <code>rig.punch</code>, 피해는 <code>fx-plan.ts:139</code> <code>shake</code>. Skia <code>Canvas</code> 는 자식이 바뀔 때마다 <code>root.render(children)</code> (<code>node_modules/@shopify/react-native-skia/lib/module/renderer/Canvas.js:98-100</code>)</td>
<td>네이티브에서 r3f(expo-gl)는 JS 스레드에서 그리므로, 재렌더가 3D 프레임과 같은 스레드를 다툰다. 웹은 모든 것이 메인 스레드 하나다. 카드 낸 직후 0.1~0.5초 끊김의 주범 후보</td>
</tr>
<tr>
<td>3</td>
<td><strong>쉬는 동안의 Skia 캔버스 비용을 없앤다.</strong> <code>onSize</code> 를 주면 Skia 가 Reanimated 프레임 콜백을 <strong>영원히</strong> 돌리며 매 프레임 캔버스를 잰다. 웹은 기기 픽셀 비율 상한도 없다</td>
<td><code>CardFxSkia.tsx:218</code> <code>onSize={size}</code> → <code>Canvas.js:63-95</code> <code>useFrameCallback(..., !!onSize)</code>. 웹 <code>SkiaPictureView.web.js:43-44,173</code> 이 <code>window.devicePixelRatio</code> 그대로(<code>Platform.web.js:125</code>). 3D 는 <code>dpr={[1, 2]}</code> 로 상한이 있다(<code>Table3D.tsx:156</code>)</td>
<td>판 내내 매 프레임 <code>measure</code> 한 번이 사라진다. 크기는 <code>fireHq</code> 에서 이미 재는 <code>layerBox</code>(<code>PlayedCardSpotlight.tsx:457</code>)로 넣으면 된다</td>
</tr>
</tbody></table>
<p>이 셋은 화질 단계와 상관없이 고화질의 모양을 바꾸지 않는다. 먼저 넣고 재 본 다음 단계를 나눈다.</p>
<h2>카드를 낼 때 일어나는 일</h2>
<pre><code>엔진 전이
 ├─ fx-bridge → 3D 배치 (카드 이동, 뱅 줄기·고리, 카메라 punch/shake, 파티클)     table3d/core/fx-bridge.ts:14
 └─ view.log 변화 → PlayedCardSpotlight 가 카드를 띄움                           PlayedCardSpotlight.tsx:238
      180ms 뒤 fireHq: measureInWindow ×2 → geom → progress 0→1 (2.0s / 2.4s)    :457-478
      같은 틱에 playSfx, 800ms 뒤 휘익                                             :480-485
</code></pre>
<p>3D 와 2D 연출이 <strong>같은 순간</strong> 시작한다. 그래서 GL 표면 두 개(3D 테이블, Skia 캔버스)가 동시에 매 프레임 그린다.</p>
<h2>원인 목록</h2>
<p><strong>확인</strong> 은 코드로 동작을 확인한 것, <strong>추측</strong> 은 그럴 만하지만 재 봐야 하는 것이다.</p>

<li>저는 지금 &quot;일반&quot;과 같은 길(RN Animated)이다. 웹에서는 JS 구동이므로 입자 수를 줄이는 것이 효과가 있다</li>
<li>중의 핵심은 <strong>블러 없음 + 셰이더 가볍게</strong> 다. 모양은 고와 거의 같다</li>
<li>3D <code>dpr</code>·안티앨리어싱은 GL 컨텍스트를 만들 때 정해진다. 판 도중 바꾸면 다음 판부터 적용한다고 적는다 (<code>Canvas</code> 에 <code>key</code> 를 줘서 다시 만들면 WebGL 컨텍스트가 하나 더 생기므로 판 도중 재생성은 피한다)</li>
<li>흔들림 끔은 &quot;움직임 줄이기&quot;(접근성)와도 맞는다. 나중에 OS 설정 <code>reduceMotion</code> 을 읽어 흔들림만 따로 끌 수도 있다</li>
</ul>
<h3>단계 값을 한곳에</h3>
<p><code>src/game/ui/fx/fx-profile.ts</code> 에 순수 표를 둔다. Skia·RN·3D 가 모두 이 표만 읽는다.</p>
<pre><code class="language-ts">export type FxLevel = &#39;low&#39; | &#39;mid&#39; | &#39;high&#39;;

export type FxProfile = {
  skia: boolean;          // false 면 RN Animated
  particles: number;      // 0.25 | 0.55 | 1
  smokeOctaves: 0 | 3 | 5;
  blur: boolean;
  gradients: boolean;
  screenFlash: number;    // 배율
  shake: number;          // 배율 (카드·카메라 공통)
  slowZoom: boolean;
  missedPieces: boolean;
  table: { dpr: [number, number]; antialias: boolean | &#39;tier&#39; };
};

export const FX_PROFILE: Record&lt;FxLevel, FxProfile&gt; = { … };
</code></pre>
<p>Skia 쪽은 레이어가 판마다 하나라 <code>profile</code> 을 일반 prop 으로 넘기면 된다(바뀔 때만 다시 렌더).
진행도마다 읽어야 하는 배율(<code>shake</code>, 확대)은 <code>ShotGeom</code> 에 숫자 필드로 넣어 워클릿이 읽게 한다.</p>
<h3>자동 선택</h3>
<p>설정의 기본값을 <code>auto</code> 로 두고, 실제 단계는 따로 고른다.</p>
<ol>
<li><strong>처음 값은 기기 등급으로.</strong> 이미 있는 <code>getDeviceTier()</code> (<code>device-tier.ts:14</code>)를 쓴다. low → 저, high → 중.
고는 사용자가 고르거나 아래 측정이 통과했을 때만</li>
<li><strong>판 시작 후 첫 연출 두세 번을 잰다.</strong> 연출이 도는 동안 <code>requestAnimationFrame</code> 간격(웹) 또는
Reanimated <code>useFrameCallback</code> 의 <code>timeSincePreviousFrame</code>(네이티브 UI 스레드)을 모은다</li>
<li><strong>내리기만 한다.</strong> 연출 중 p95 &gt; 25ms 이거나 33ms 넘는 프레임이 10% 넘으면 한 단계 내리고,
한 번만 &quot;연출을 &#39;보통&#39;으로 낮췄다&quot; 짧은 안내를 띄운다. 자동으로 올리지는 않는다 (오르내림 반복 방지)</li>
<li>판 도중 단계를 내려도 그 연출은 시작할 때 정한 화질로 끝까지 간다 (지금도 <code>PlayedCardSpotlight.tsx:414</code> 가 그렇게 한다)</li>
<li>자동이 내린 결과는 <code>bang.fx.autoLevel</code> 에 기억해, 다음 실행에서 거기서 시작한다</li>
</ol>
<p>AI 배속(<code>fxPacing.timeScale</code>)이 4배를 넘는 검증용 배속에서는 측정을 건너뛴다. 연출이 짧아 표본이 안 된다.</p>

<h3>작업 순서</h3>
<ol>
<li><strong>재는 도구부터.</strong> <code>frame-meter.ts</code> 와 아래 스니펫으로 지금 값을 적어 둔다 (고 / 일반 / <code>?flat=1</code>)</li>
<li><strong>단계와 상관없는 고침.</strong> 위 3가지 + <code>CardFxSkiaLayer</code> <code>memo</code> + 저장값 읽기 전 Skia 안 받기. 다시 잰다</li>
<li>여기서 충분히 좋아졌으면 4 이후는 작게 해도 된다</li>
<li><code>fx-profile.ts</code> 와 <code>quality.ts</code> 이전 (단위 테스트: 옛 값 → 새 값, 표의 단조성 — 고가 중보다 적게 켜는 항목이 없음)</li>
<li>Skia 쪽에 profile 연결 (중 단계). <code>?fxloop=1&amp;q=mid</code> 처럼 반복 모드에서 단계를 고를 수 있게</li>
<li>RN 쪽(저) 입자 줄이기</li>
<li>3D budget 연결</li>
<li>자동 선택</li>
<li>설정 UI, <code>docs/card-fx.md</code> 고치기</li>
<li><code>npm test &amp;&amp; npm run typecheck</code>, <code>npx eslint src/game/ui src/game/table3d</code>. 규칙은 안 건드리므로 시뮬레이터는 생략</li>
</ol>
<h2>재는 법</h2>
<h3>웹</h3>
<p><strong>Performance 패널</strong></p>
<ol>
<li>개발 서버에서 <code>/game/…?fxloop=1</code> (뱅! 3초마다), <code>?fxloop=missed</code> (빗나감!)</li>
<li>DevTools → Performance → CPU 4x slowdown → 녹화 10초</li>
<li>볼 곳: Frames 줄의 빨간·노란 프레임, Main 줄의 긴 작업(50ms 넘는 회색 삼각형), GPU 줄</li>
<li>Main 에서 <code>Overlay3D</code> · <code>PlayedCardSpotlight</code> 렌더가 연출 동안 몇 번 나오는지. React DevTools Profiler 의 &quot;Highlight updates&quot; 로도 보인다</li>
<li>비교 짝: <code>?fxloop=1</code> 과 <code>?fxloop=1&amp;flat=1</code> (3D 끔), 고 / 일반</li>
</ol>
<p>브라우저 패널이 가려져 있으면 <code>requestAnimationFrame</code> 이 멈춘다 (<code>docs/card-fx.md</code> &quot;함정&quot;). 보이는 상태에서 잰다.</p>
<p><strong>콘솔 스니펫: rAF 간격 기록</strong></p>
<p><code>?fxloop=1</code> 을 켠 채로 콘솔에 붙인다. 15초 동안 프레임 간격을 모아 표로 보인다.</p>
<pre><code class="language-js">(() =&gt; {
  const gaps = [];
  let last = performance.now();
  let on = true;
  const tick = (now) =&gt; {
    gaps.push(now - last);
    last = now;
    if (on) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  const longs = [];
  const po = new PerformanceObserver((l) =&gt; l.getEntries().forEach((e) =&gt; longs.push(Math.round(e.duration))));
  try { po.observe({ type: &#39;longtask&#39;, buffered: false }); } catch {}
  setTimeout(() =&gt; {
    on = false;
    po.disconnect();
    const s = gaps.slice(1).sort((a, b) =&gt; a - b);
    const q = (p) =&gt; s[Math.min(s.length - 1, Math.floor(s.length * p))].toFixed(1);
    const avg = s.reduce((a, b) =&gt; a + b, 0) / s.length;
    console.table({
      frames: s.length,
      fps: (1000 / avg).toFixed(1),
      p50: q(0.5), p95: q(0.95), p99: q(0.99), max: s.at(-1).toFixed(1),
      over25ms: s.filter((g) =&gt; g &gt; 25).length,
      over50ms: s.filter((g) =&gt; g &gt; 50).length,
      longTasks: longs.join(&#39;,&#39;),
    });
  }, 15000);
})();
</code></pre>
<p>연출 구간만 보고 싶으면 <code>__shot.start()</code> 직전·직후에 <code>performance.mark(&#39;fx&#39;)</code> 를 찍고 그 사이 간격만 거른다.
<code>?fxloop=hold</code> 로 진행도를 멈추면 파생값이 안 바뀌어 다시 그리지 않으므로, 셰이더 비용은 멈춤이 아니라 반복으로 잰다.</p>
<p><strong>GPU 만 따로</strong>: DevTools → Rendering → Frame Rendering Stats. 연기 셰이더 한정 전후를 이것으로 비교한다.</p>
<h3>네이티브</h3>
<ul>
<li><strong>Release 빌드에서 잰다.</strong> 개발 빌드는 JS 가 몇 배 느리다. <code>npx expo run:ios --configuration Release</code></li>
<li>개발 메뉴 <strong>Perf Monitor</strong>: UI·JS 프레임을 따로 보인다. 카드 낼 때 JS 가 떨어지면 고침 2, UI 가 떨어지면 고침 1·3 쪽이다</li>
<li>iOS: Xcode Instruments 의 <strong>Animation Hitches</strong>, <strong>Metal System Trace</strong> (GPU 시간), <strong>Time Profiler</strong> (JS·UI 스레드)</li>
<li>Android: <code>adb shell dumpsys gfxinfo &lt;패키지&gt; framestats</code>, Perfetto</li>
<li>앱 안에서: <code>frame-meter.ts</code> 가 Reanimated <code>useFrameCallback</code> 의 <code>timeSincePreviousFrame</code>(UI 스레드)과
JS 쪽 <code>requestAnimationFrame</code> 간격(JS 스레드)을 함께 모아 연출이 끝날 때 p50·p95·최대를 로그로 남긴다.
개발 모드에서 <code>globalThis.__fxMeter</code> 로 꺼내 본다. 자동 선택도 이 값을 쓴다</li>
<li>네이티브에는 주소창이 없으므로 반복 연출은 도감(<code>CardFxPreview</code>, <code>PlayedCardSpotlight.tsx:360</code>)에서 같은 카드를 여러 번 돌려 잰다</li>
</ul>
