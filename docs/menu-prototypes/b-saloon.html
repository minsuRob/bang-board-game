<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B · 살롱 간판</title>
<link href="https://fonts.googleapis.com/css2?family=Sancreek&family=Playfair+Display+SC:wght@700&family=Nanum+Myeongjo:wght@700;800&family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #e9b949;
    --gold-hi: #fbe3a0;
    --gold-lo: #8a5f17;
    --board: #14201a;
    --plank: #6b4422;
    --plank-dark: #3f2612;
    --cream: #f5e6c4;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    padding: 48px 16px;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,190,90,.18), transparent 55%),
      linear-gradient(rgba(36,18,6,.82), rgba(18,9,3,.92)),
      url(../../assets/board/wood-tile.jpg) center/420px;
    font-family: 'Nanum Myeongjo', serif;
    color: var(--cream);
  }
  .sign {
    position: relative;
    padding: 34px 64px 30px;
    background: var(--board);
    border: 6px solid transparent;
    border-image: linear-gradient(135deg, var(--gold-hi), var(--gold-lo) 40%, var(--gold) 60%, var(--gold-lo)) 1;
    box-shadow: 0 0 0 3px #0b0f0c, 0 24px 50px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.6);
    text-align: center;
  }
  .bulbs { position: absolute; inset: -18px; pointer-events: none;
    background:
      radial-gradient(circle, #fff6d0 0 3px, #ffbf3d 4px 5px, transparent 6px) 0 0/28px 28px repeat-x,
      radial-gradient(circle, #fff6d0 0 3px, #ffbf3d 4px 5px, transparent 6px) 0 100%/28px 28px repeat-x,
      radial-gradient(circle, #fff6d0 0 3px, #ffbf3d 4px 5px, transparent 6px) 0 0/28px 28px repeat-y,
      radial-gradient(circle, #fff6d0 0 3px, #ffbf3d 4px 5px, transparent 6px) 100% 0/28px 28px repeat-y;
    filter: drop-shadow(0 0 6px #ffb84a);
  }
  .est { font-family: 'Playfair Display SC', serif; font-size: 13px; letter-spacing: 6px; color: var(--gold); }
  h1 {
    font-family: 'Sancreek', serif; font-weight: 400; font-size: 118px; line-height: 1; margin: 4px 0 2px;
    background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 45%, var(--gold-lo) 52%, var(--gold) 70%, var(--gold-hi) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 18px rgba(233,185,73,.35));
  }
  .sub { font-size: 15px; color: #d9c79e; letter-spacing: 1px; }
  .flourish { color: var(--gold); font-size: 14px; letter-spacing: 8px; margin-top: 10px; }

  .boards { width: min(480px, 100%); display: grid; gap: 22px; }
  .plank {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 28px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #7d5129, var(--plank) 55%, #573417);
    border-radius: 6px;
    box-shadow: inset 0 2px 0 rgba(255,220,160,.25), inset 0 -3px 0 rgba(0,0,0,.35), 0 10px 18px rgba(0,0,0,.55);
    cursor: pointer; transition: transform .2s;
  }
  .plank:hover { transform: rotate(-1.2deg) translateY(-2px); }
  .plank::before, .plank::after { content: ''; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-hi), var(--gold-lo)); }
  .plank::before { left: 10px } .plank::after { right: 10px }
  .chain { position: absolute; top: -22px; width: 2px; height: 22px; background: repeating-linear-gradient(#a08860 0 4px, #3a2f22 4px 6px); }
  .chain.l { left: 22%; } .chain.r { right: 22%; }
  .label { font-family: 'Do Hyeon', sans-serif; font-size: 26px; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  .hint { font-size: 12.5px; color: #e3c995; text-align: right; line-height: 1.5; }
  .plank.primary {
    padding: 24px 28px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #a33a22, #7e2414 60%, #5e170b);
    box-shadow: inset 0 0 0 2px var(--gold), inset 0 2px 0 rgba(255,220,160,.3), 0 12px 24px rgba(0,0,0,.6), 0 0 30px rgba(233,185,73,.25);
  }
  .plank.primary .label { font-size: 34px; color: var(--gold-hi); }
  .row { display: flex; gap: 12px; }
  .row input { flex: 1; background: #1d120a; border: 2px solid #6b4a26; border-radius: 6px; padding: 12px 16px;
    color: var(--cream); font-family: 'Playfair Display SC', serif; font-size: 20px; letter-spacing: 8px; box-shadow: inset 0 3px 8px rgba(0,0,0,.6); }
  .row input::placeholder { font-family: 'Nanum Myeongjo'; letter-spacing: 3px; font-size: 15px; color: #8d7550; }
  .row button { font-family: 'Do Hyeon'; font-size: 20px; padding: 0 22px; border-radius: 6px; cursor: pointer;
    color: #2a1808; border: none; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo)); box-shadow: 0 4px 0 #4d330b; }
  .lever { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; }
  .lever .label { font-size: 20px; }
  .switch { display: flex; background: #1d120a; border-radius: 999px; padding: 4px; border: 1px solid #6b4a26; }
  .switch span { padding: 6px 16px; border-radius: 999px; font-family: 'Do Hyeon'; font-size: 16px; color: #a88d60; }
  .switch .on { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #2a1808; }
  .foot { font-size: 12px; color: #a48a62; text-align: center; letter-spacing: .5px; }
</style>
</head>
<body>
  <header class="sign">
    <div class="bulbs"></div>
    <div class="est">— EST. 1880 · SALOON —</div>
    <h1>BANG!</h1>
    <p class="sub">보안관과 무법자, 그리고 숨어 있는 배신자</p>
    <div class="flourish">✦ ✦ ✦</div>
  </header>

  <nav class="boards">
    <a class="plank primary"><i class="chain l"></i><i class="chain r"></i><span class="label">AI와 대전</span><span class="hint">4~7인 · 난이도 상중하<br/>하이 눈 확장</span></a>
    <a class="plank"><i class="chain l"></i><i class="chain r"></i><span class="label">방 만들기</span><span class="hint">코드를 친구에게<br/>알려 주면 들어온다</span></a>
    <div class="row"><input placeholder="방 코드" /><button>참가</button></div>
    <a class="plank"><i class="chain l"></i><i class="chain r"></i><span class="label">카드 도감</span><span class="hint">카드 52종 · 캐릭터 42명<br/>이벤트 40장 · 규칙 메모</span></a>
    <div class="lever"><span class="label">연출 화질</span><div class="switch"><span class="on">고화질</span><span>일반</span></div></div>
  </nav>

  <p class="foot">Q 차례 마치기 · W 반응하지 않음 · 1~0 손패 고르기 · Esc 취소</p>
</body>
</html>
